name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: conference
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://conference.ipu-edu.uz
          # Baked into the client bundle at build time (used by /admin).
          NEXT_PUBLIC_ADMIN_API_URL: https://ipuadmin.educon.uz
          CONFERENCE_API_URL: https://ipuuser.educon.uz

      - name: Deploy
        run: |
          DEPLOY=/var/www/conference.ipu-edu.uz
          rm -rf $DEPLOY/app.new $DEPLOY/app.old
          cp -a .next/standalone $DEPLOY/app.new
          cp -a .next/static $DEPLOY/app.new/.next/static
          cp -a public $DEPLOY/app.new/public
          # Runtime env for the standalone server: the API routes read
          # CONFERENCE_API_URL when proxying form submissions to ipu-back.
          printf 'CONFERENCE_API_URL=https://ipuuser.educon.uz\n' > $DEPLOY/app.new/.env.production
          if [ -d $DEPLOY/app ]; then mv $DEPLOY/app $DEPLOY/app.old; fi
          mv $DEPLOY/app.new $DEPLOY/app
          # Keep the pm2 daemon under systemd (pm2-root); a daemon spawned
          # inside this job would be killed when the job's processes are
          # cleaned up.
          systemctl is-active --quiet pm2-root || systemctl restart pm2-root
          pm2 startOrReload $DEPLOY/ecosystem.config.js
          pm2 save
          rm -rf $DEPLOY/app.old
